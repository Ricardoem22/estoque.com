<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar - La Barca</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-login">
    <div class="container login">
        <div class="login-marca">
            <span class="marca-icone">LB</span>
            <h1>La Barca</h1>
            <p class="sub">Controle de Estoque</p>
        </div>

        {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}

        <form method="post">
            <input type="hidden" name="proximo" value="{{ proximo }}">
            <label for="senha">Senha da equipe</label>
            <input type="password" id="senha" name="senha" required autofocus autocomplete="current-password">
            <div class="form-actions">
                <button class="btn btn-grande" type="submit">Entrar</button>
            </div>
        </form>
    </div>
</body>
</html>
