<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar - Gestor Full</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-login">
    <div class="container login">
        <div class="login-marca">
            <span class="marca-icone">GF</span>
            <h1>Gestor Full de Restaurante</h1>
            <p class="sub">La Barca</p>
        </div>

        {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}

        <form method="post">
            <input type="hidden" name="proximo" value="{{ proximo }}">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" value="{{ usuario }}" required autofocus
                   autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required autocomplete="current-password">
            <div class="form-actions">
                <button class="btn btn-grande" type="submit">Entrar</button>
            </div>
        </form>
        <p class="login-link"><a href="{{ url_for('funcionarios.esqueci_senha') }}">Esqueci a senha</a></p>
    </div>
</body>
</html>
